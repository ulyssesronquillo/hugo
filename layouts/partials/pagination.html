
{{- $pag := . -}}
{{- if gt $pag.TotalPages 1 }}
<nav class="pagination" aria-label="Page navigation">
  {{- if $pag.HasPrev }}
    <a class="page-link" href="{{ $pag.Prev.URL }}">« Prev</a>
  {{- end }}

  {{- range $pag.Pagers }}
    <a class="page-link{{ if eq . $pag }} active{{ end }}"
       href="{{ .URL }}">
      {{ .PageNumber }}
    </a>
  {{- end }}

  {{- if $pag.HasNext }}
    <a class="page-link" href="{{ $pag.Next.URL }}">Next »</a>
  {{- end }}
</nav>
{{- end }}
