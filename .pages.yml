
media:
  input: static/images
  output: /images

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: draft
        label: Draft
        type: boolean

      - name: slug
        label: URL Slug
        type: string

      - name: description
        label: Description
        type: text

      - name: body
        label: Content
        type: rich-text

  - name: about
    label: About Page
    type: file
    path: content/about.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string

      - name: body
        label: Content
        type: rich-text

