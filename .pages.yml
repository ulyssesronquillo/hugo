media: static/images

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    view:
      primary: title
      fields: [title, date, draft]
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date

      - name: draft
        label: Draft
        type: boolean

      - name: body
        label: Content
        type: rich-text

- name: about
  label: About
  type: file
  path: content/about.md
  fields:
    - name: title
      type: string
    - name: hidemeta
      type: boolean
    - name: comments
      type: boolean
    - name: ShowBreadCrumbs
      type: boolean
    - name: body
      type: rich-text

